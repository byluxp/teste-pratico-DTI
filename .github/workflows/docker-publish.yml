name: 🐳 Docker Build and Push

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Permissões necessárias para escrever no GitHub Container Registry (GHCR)
permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: 🛒 Checkout do Código
        uses: actions/checkout@v4

      - name: 🏗️ Configurar Docker Buildx
        # O Buildx é essencial para suportar cache avançado e builds multi-plataforma
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login no GitHub Container Registry
        # Autenticação automática usando o token nativo do GitHub Actions
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 📝 Normalizar Nome da Imagem
        # O GHCR exige nomes de imagem em letras MINÚSCULAS.
        # Este passo converte o caminho do repositório (ex: GUS74V0/SeuImovel) para minúsculo.
        id: repo_name
        run: echo "lowercase_repo=${GITHUB_REPOSITORY,,}" >> $GITHUB_OUTPUT

      # --- BACKEND ---
      - name: 🏷️ Metadados do Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_name.outputs.lowercase_repo }}/backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: 🚀 Build e Push do Backend
        uses: docker/build-push-action@v6
        with:
          context: ./spring-app
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          # Cache GHA: Salva as camadas no GitHub Actions para acelerar o próximo build
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- FRONTEND ---
      - name: 🏷️ Metadados do Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo_name.outputs.lowercase_repo }}/frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=

      - name: 🚀 Build e Push do Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./FrontEnd
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
